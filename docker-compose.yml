services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: motibro-app
    restart: unless-stopped
    volumes:
      - .:/var/www/html
      - ./docker/php/php.ini:/usr/local/etc/php/php.ini
    networks:
      - motibro
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
      mailhog:
        condition: service_started

  mysql:
    image: mysql:8.0
    container_name: motibro-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: motibro
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: motibro
      MYSQL_PASSWORD: motibro
    ports:
      - "3313:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d
    networks:
      - motibro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:alpine
    container_name: motibro-redis
    restart: unless-stopped
    ports:
      - "6383:6379"
    networks:
      - motibro

  mailhog:
    image: axllent/mailpit:latest
    container_name: motibro-mailhog
    restart: unless-stopped
    ports:
      - "8029:8025"
      - "1031:1025"
    networks:
      - motibro

  nginx:
    image: nginx:alpine
    container_name: motibro-nginx
    restart: unless-stopped
    ports:
      - "8092:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - motibro

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: motibro-scheduler
    restart: unless-stopped
    volumes:
      - .:/var/www/html
      - ./docker/php/php.ini:/usr/local/etc/php/php.ini
    networks:
      - motibro
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    command: php artisan schedule:work

  node:
    image: node:22-alpine
    container_name: motibro-node
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    ports:
      - "5275:5173"
    command: sh -c "npm install --legacy-peer-deps && npm run dev -- --host 0.0.0.0"
    networks:
      - motibro

networks:
  motibro:

volumes:
  db_data:
